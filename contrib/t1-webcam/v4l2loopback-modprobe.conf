# Virtual webcam for browsers. The T1 camera only outputs H.264,
# which Chrome/Firefox won't take from a V4L2 device; t1-webcam.service decodes it into this.
# exclusive_caps=1 is required for Chrome to list it (it then appears only while fed).
# Install to /etc/modprobe.d/v4l2loopback.conf
options v4l2loopback devices=1 video_nr=10 card_label="T1 camera (browser)" exclusive_caps=1

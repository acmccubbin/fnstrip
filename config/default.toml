# fnstrip config. Copy to ~/.config/fnstrip/config.toml and edit; the renderer reads it at
# start (`systemctl --user restart t1-touchbar.service` to apply). This file is also built
# into the binary, and used when you have no config of your own.
#
# Format: a subset of TOML. Values are quoted strings: "basic" (escapes \" \\ \n \t) or
# 'literal' (no escapes, handy for shell commands with double quotes); the on/off settings
# also take true/false.
#
# Mistakes cost only their own line: each is logged with its line number to
# `journalctl --user -u t1-touchbar.service` and skipped (a bad value keeps that setting's
# default; a broken [[extras]] entry leaves out that button), and the rest applies.
# Compatibility: settings are only ever added, so this file keeps working on newer fnstrip;
# a renamed setting keeps its old name working, with a warning, for at least one release.
#
# default_row = "controls" (brightness, media, volume; F1-F12 while Fn is held), or
#               "function" (Esc + F1-F12; the controls while Fn is held). Goes above the
#               first [[extras]].
#
# startup_animation = "on" (default: a light show with the fnstrip logo when the renderer
#               starts; a touch or Fn skips it) or "off". Also above the first [[extras]].
#
# debug_gestures = "off" (default) or "on": Fn triple-tap-and-hold shows the test screen
#               (animations with frame-rate stats; tap to step, the right end or Fn to
#               leave), and Fn quad-tap switches to the next theme until fnstrip restarts.
#               Also above the first [[extras]].
#
# temperature_unit = "c" (default) or "f": the temperature meter in °C or °F. Also above the
#               first [[extras]].
#
# theme = "default", "mono", "pastel" or "rainbow": the colours of the whole bar, meters
#               and spectra included (mono is grey throughout, the camera too; pastel and
#               rainbow give every button its own colour). Also above the first [[extras]].
#
# [colors]: optional, overrides single colours of the theme, as "#rrggbb": background,
#               plate, pressed, label, dim (muted or off icons), lit and lit_pressed (buttons
#               that are on), fill and muted (slider fills). For example:
#
#   theme = "mono"
#   [colors]
#   lit = "#c0392b"
#
# [[extras]]: buttons of the extras row (double-tap Fn; it stays until the next Fn press),
# up to 10.
#   icon    = camera | mic | vpn  (toggles, left after Esc, in this order; each has an on
#             and an off look; lit, the camera shows its picture, the mic a spectrum and the
#             vpn a traffic graph with its rates)
#           | cpu | mem | disk | net | battery | temp | fan  (meters, at the right end: a
#             live graph and value; the battery fills to its charge, its icon shows quarters
#             and a bolt while on power, green on power, amber at 20% and red at 10%, with
#             the time to empty or full; temp is the CPU package in °C or °F, red within 20 °C of
#             critical; fan is the first two fans' rpm, as lines on one scale from just
#             under the lowest fan minimum to the highest maximum)
#   command = run with `sh -c` when tapped (optional for meters)
#   status  = optional; run with `sh -c` while the row shows (every second) and after a
#             tap. Exit 0 lights the button (green plate, "on" icon). Without it the
#             button is never lit.
#   interface = for vpn and net: the network interface to graph (vpn: default wg0;
#             net: default every interface of a device that is up)
# Commands run as you, with the t1-touchbar.service environment.
#
# Examples (see contrib/t1-webcam for the camera's service and script; the VPN command is
# yours to supply):
#
#   [[extras]]
#   icon = "camera"
#   command = "webcam toggle"
#   status = "systemctl --user --quiet is-active t1-webcam.service"
#
#   [[extras]]
#   icon = "vpn"
#   command = "my-vpn-toggle"
#   status = "test -e /sys/class/net/wg0"
#
# The VPN button works with any VPN: fnstrip reads no output. `command` toggles it (its
# output is ignored), `status` says whether it's up (exit 0 = lit), and `interface` names
# its network interface for the traffic graph (`ip link` lists them). For example:
#
#   WireGuard:      command = "if [ -e /sys/class/net/wg0 ]; then wg-quick down wg0; else wg-quick up wg0; fi"
#                   status = "test -e /sys/class/net/wg0"         interface = "wg0"
#   NetworkManager: command = "if nmcli -t -f NAME connection show --active | grep -qx Work; then nmcli connection down Work; else nmcli connection up Work; fi"
#                   status = "nmcli -t -f NAME connection show --active | grep -qx Work"
#                   interface = "tun0" (OpenVPN; WireGuard connections use their own name)
#   Tailscale:      command = "tailscale status >/dev/null && tailscale down || tailscale up"
#                   status = "tailscale status >/dev/null"         interface = "tailscale0"
#
# (wg-quick needs root; NetworkManager can bring WireGuard up and down as you.)
#
# Commands depend on your setup. Common swaps (any toggle icon can use any of them):
#
#   Mic mute, PipeWire (the default below):
#                   command = "wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"
#                   status = "! wpctl get-volume @DEFAULT_AUDIO_SOURCE@ | grep -q MUTED"
#   Mic mute, PulseAudio:
#                   command = "pactl set-source-mute @DEFAULT_SOURCE@ toggle"
#                   status = "LC_ALL=C pactl get-source-mute @DEFAULT_SOURCE@ | grep -q 'Mute: no'"
#   Do not disturb, mako:  command = "makoctl mode -t do-not-disturb"
#                          status = "makoctl mode | grep -q do-not-disturb"
#   Do not disturb, dunst: command = "dunstctl set-paused toggle"
#                          status = "dunstctl is-paused | grep -q true"
#   Do not disturb, SwayNC: command = "swaync-client -d"
#                           status = "swaync-client -D | grep -q true"
#
# Try a command in a terminal first: if it works there, it works on the bar. The status
# command must exit 0 exactly when the button should be lit (`echo $?` shows it).

default_row = "controls"

[[extras]]
# Lit while the mic is live; struck through when muted.
icon = "mic"
command = "wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle"
status = "! wpctl get-volume @DEFAULT_AUDIO_SOURCE@ | grep -q MUTED"

[[extras]]
# Graphs: user (bottom) and system CPU time.
icon = "cpu"

[[extras]]
# Graphs: memory in use (bottom) and page cache.
icon = "mem"

[[extras]]
# Graphs: bytes read (bottom) and written per second, scaled to the recent peak.
icon = "disk"

[[extras]]
# Graphs: bytes received (bottom) and sent per second, scaled to the recent peak.
icon = "net"

[[extras]]
# Fills to the charge; green with a bolt while on power.
icon = "battery"

[package]
name = "fnstrip-web"
version = "0.1.0"
description = "fnstrip's own drawing code, built for the browser (the project page's bar)"
edition = "2024"
rust-version = "1.88"
publish = false
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
fnstrip = { path = ".." }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
